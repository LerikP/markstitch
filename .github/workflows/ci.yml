name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.11"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          uv sync --locked --extra parser
          npm ci --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund

      - name: Check formatting, lint, and types
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra parser ruff format --check .
          uv run --locked --extra parser ruff check .
          uv run --locked --extra parser mypy markstitch
          uv run --locked --extra parser ty check markstitch
          uv run --locked --extra parser pyrefly check markstitch

      - name: Run tests, including renderer integration
        run: uv run --locked --extra parser pytest

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.11"
          python-version: "3.12"
          enable-cache: false

      - name: Check release tag against package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected_tag = f"v{project['version']}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Release tag {actual_tag!r} must match {expected_tag!r}")
          PY

      - name: Build and check wheel and source distribution
        run: |
          uv sync --locked --extra parser
          uv build
          uv run --locked --extra parser twine check --strict dist/*

      - name: Test installed distributions outside the source tree
        shell: bash
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$distribution" python -I -c \
              'import importlib.util; from markstitch import YFM, Header3; assert YFM(Header3("Hello")).to_yfm() == "### Hello"; assert importlib.util.find_spec("markdown_it") is None'
            uv run --isolated --no-project --with "$distribution[parser]" python -I -c \
              'from markstitch import Heading, parse; document = parse("# Hello", strict=True); heading = next(iter(document)); assert isinstance(heading, Heading); heading.text = "Markstitch"; assert document.to_yfm() == "# Markstitch"'
          done

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
