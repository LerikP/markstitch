[project]
name = "markstitch"
version = "0.1.1"
description = "Compose, parse, and edit YFM documents in Python"
authors = [
    { name = "Valery Pavlov" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = []

[project.urls]
Repository = "https://github.com/LerikP/markstitch"
Issues = "https://github.com/LerikP/markstitch/issues"

[project.optional-dependencies]
parser = [
    "markdown-it-py>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.0",
    "mypy>=1.18.0",
    "ty>=0.0.85",
    "pyrefly>=1.3.2",
    "twine>=6.2.0",
]

[build-system]
requires = [
    "hatchling>=1.27.0",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "markstitch",
]

[tool.hatch.build.targets.sdist]
include = [
    "/markstitch",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/package*.json",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-ra"
markers = [
    "renderer: integration with the pinned Node.js YFM renderer (npm ci required)",
]

[tool.ruff]
line-length = 119
target-version = "py312"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "ERA",
    "LOG",
    "G",
    "ISC",
    "N",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PTH",
    "Q",
    "RET",
    "S",
    "SIM",
    "T10",
    "T20",
    "TC",
    "TID",
    "W",
    "RUF",
    "PERF",
    "FURB",
    "TRY",
    "ASYNC",
]
ignore = [
    "SIM108",
    "SIM102",
    "PLR2004",
    "TC003",
    "TC006",
    "N805",
    "TRY003",
    "TRY400",
    "PERF203",
    "S308",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF015",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.pylint]
max-args = 20
max-positional-args = 20
max-branches = 15

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
exclude = "(?x)(tests.+\\.py$)"
follow_imports = "normal"
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = false
implicit_optional = false
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true

[tool.pyrefly]
project-includes = ["markstitch"]
python-version = "3.12"
